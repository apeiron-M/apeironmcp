type TaskInput {
  id: OID!
  title: String!
  description: String
  type: TaskDataType!
  isRequired: Boolean!
  linkedTaskOutputId: OID
  createdAt: DateTime!
}

type TaskOutput {
  id: OID!
  title: String!
  description: String
  type: TaskDataType!
  deliveryFormat: String
  createdAt: DateTime!
}

type WbsTask {
  id: OID!
  deliverableId: OID
  parentTaskId: OID
  ownerId: OID
  code: String!
  title: String!
  summary: String
  description: String
  status: TaskStatus!
  priority: TaskPriority!
  progress: Int
  estimatedHours: Int
  actualHours: Int
  startDate: DateTime
  dueDate: DateTime
  inputs: [TaskInput!]!
  outputs: [TaskOutput!]!
  createdAt: DateTime!
  updatedAt: DateTime
}

type TeamMember {
  id: OID!
  name: String!
  email: String
  role: String
  avatar: String
  isActive: Boolean!
  joinedAt: DateTime!
}

enum TaskStatus {
  SCOPING
  TODO
  IN_PROGRESS
  REVIEW
  DONE
  BLOCKED
  CANCELLED
}

enum TaskPriority {
  LOW
  MEDIUM
  HIGH
  STRETCH
  CRITICAL
}

enum TaskDataType {
  DOCUMENT
  DATA
  CODE
  DESIGN
  APPROVAL
  FEEDBACK
  RESOURCE
  DELIVERABLE
}

type Deliverable {
  id: OID!
  title: String!
  description: String
  timeline: String
  status: DeliverableStatus!
  createdAt: DateTime!
  updatedAt: DateTime
}

enum DeliverableStatus {
  PLANNING
  IN_PROGRESS
  REVIEW
  COMPLETED
  CANCELLED
}

type WorkBreakdownStructureState {
  id: OID!
  title: String
  description: String
  deliverables: [Deliverable!]!
  tasks: [WbsTask!]!
  teamMembers: [TeamMember!]!
  createdAt: DateTime!
  updatedAt: DateTime
}

# core

input CreateWbsInput {
  id: OID!
  title: String!
  description: String
  createdAt: DateTime!
}

input UpdateWbsInfoInput {
  title: String
  description: String
  updatedAt: DateTime!
}

