type TodoItem {
  id: OID!
  title: String!
  description: String
  completed: Boolean!
  createdAt: DateTime!
  completedAt: DateTime
}

type SimpleTodoState {
  todos: [TodoItem!]!
  totalCount: Int!
  completedCount: Int!
}



# todos

input AddTodoInput {
  id: OID!
