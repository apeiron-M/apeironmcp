  description: String
  createdAt: DateTime!
}

input UpdateTodoInput {
  id: OID!
  title: String
  description: String
}

input CompleteTodoInput {
  id: OID!
  completedAt: DateTime!
}

input UncompleteTodoInput {
  id: OID!
}

input DeleteTodoInput {
  id: OID!
}